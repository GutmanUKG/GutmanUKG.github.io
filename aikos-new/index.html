    <script>
      // Тема выставляется до первой отрисовки, иначе моргает не та.
      // localStorage в приватном окне может бросать — поэтому try/catch.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('aikos-theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
